#=================================================
# Description: Build OpenWrt using GitHub Actions
# Author: P3TERX (Modified & Fixed)
#=================================================

name: LEDE-5.15-X86

on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 5,15,25 * *

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  SOURCE_REPO: coolsnowwolf/lede
  DEVICE_TARGET: x86
  DEVICE_SUBTARGET: 64
  OPENWRT_PATH: /workdir/openwrt
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  CACHE_TOOLCHAIN: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查磁盘空间
      run: df -hT

    - name: 检查服务器性能
      run: |
        echo "========== CPU信息 =========="
        echo "CPU物理数量: $(grep 'physical id' /proc/cpuinfo \
          | sort | uniq | wc -l)"
        echo "CPU核心信息: $(grep name /proc/cpuinfo \
          | cut -f2 -d: | uniq -c)"
        echo "========== 内存信息 =========="
        free -h
        echo "========== 硬盘信息 =========="
        df -hT

    - name: 释放磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: 最大化构建空间
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 4096
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: 释放完成确认
      run: |
        echo "============================================"
        df -hT
        echo "============================================"

    - name: 检出代码
      uses: actions/checkout@main

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* \
          /usr/share/dotnet /usr/local/lib/android \
          /opt/ghc /etc/mysql /etc/php
        sudo -E apt-get -y purge \
          azure-cli* docker* ghc* zulu* llvm* \
          firefox* google* dotnet* aspnetcore* \
          powershell* openjdk* adoptopenjdk* \
          mysql* php* mongodb* moby* snap* || true
        sudo -E apt-get update -y
        sudo -E apt-get full-upgrade -y
        sudo -E apt-get install -y \
          ack antlr3 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 ccache cmake \
          cpio curl device-tree-compiler fastjar flex gawk \
          gettext gcc-multilib g++-multilib git gperf haveged \
          help2man intltool libc6-dev-i386 libelf-dev \
          libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build \
          p7zip p7zip-full patch pkgconf python2.7 python3 \
          python3-pyelftools python3-setuptools qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get autoremove --purge
        sudo -E apt-get clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 下载固件源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 更新 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: 加载自定义插件
      run: |
        cd openwrt/package
        mkdir -p openwrt-packages
        cd openwrt-packages
        # 带错误处理的克隆
        git clone --depth=1 \
          https://github.com/gxnnlin/openwrt-packages.git \
          || echo "::warning::openwrt-packages 克隆失败，继续..."
        git clone --depth=1 \
          https://github.com/Openwrt-Passwall/openwrt-passwall.git \
          || echo "::warning::passwall 克隆失败，继续..."

    - name: 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: 固件定制配置
      run: |
        cd openwrt
        rm -f ./.config*
        touch ./.config

        # ======== 目标平台 ========
        cat >> .config <<'EOF'
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_TARGET_ROOTFS_TARGZ=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        EOF

        # ======== 固件标题 ========
        cat >> .config <<'EOF'
        CONFIG_GRUB_TITLE="OpenWrt by Lean"
        EOF

        # ======== 固件压缩 ========
        cat >> .config <<'EOF'
        CONFIG_TARGET_IMAGES_GZIP=y
        EOF

        # ======== 固件分区大小 ========
        cat >> .config <<'EOF'
        CONFIG_TARGET_KERNEL_PARTSIZE=128
        CONFIG_TARGET_ROOTFS_PARTSIZE=512
        EOF

        # ======== 固件类型 ========
        cat >> .config <<'EOF'
        CONFIG_EFI_IMAGES=y
        CONFIG_GRUB_IMAGES=y
        CONFIG_VMDK_IMAGES=y
        EOF

        # ======== IPv6 支持 ========
        cat >> .config <<'EOF'
        CONFIG_IPV6=y
        CONFIG_KERNEL_IPV6=y
        CONFIG_PACKAGE_ipv6helper=y
        CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
        EOF

        # ======== 多文件系统支持 ========
        cat >> .config <<'EOF'
        CONFIG_PACKAGE_kmod-fs-cifs=y
        CONFIG_PACKAGE_kmod-fs-f2fs=y
        CONFIG_PACKAGE_kmod-fs-nfs=y
        CONFIG_PACKAGE_kmod-fs-nfs-common=y
        CONFIG_PACKAGE_kmod-fs-nfs-common-rpcsec=y
        CONFIG_PACKAGE_kmod-fs-nfs-v3=y
        CONFIG_PACKAGE_kmod-fs-nfs-v4=y
        CONFIG_PACKAGE_kmod-fs-nfsd=y
        CONFIG_PACKAGE_kmod-fs-squashfs=y
        EOF

        # ======== USB 支持 ========
        cat >> .config <<'EOF'
        CONFIG_PACKAGE_kmod-usb-ehci=y
        CONFIG_PACKAGE_kmod-usb-net-aqc111=y
        CONFIG_PACKAGE_kmod-usb-net-pl=y
        CONFIG_PACKAGE_kmod-usb-ohci=y
        CONFIG_PACKAGE_kmod-usb-ohci-pci=y
        CONFIG_PACKAGE_kmod-usb-printer=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-uhci=y
        CONFIG_PACKAGE_kmod-usb-wdm=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb2-pci=y
        CONFIG_PACKAGE_kmod-usb3=y
        EOF

        # ======== LuCI 插件 ========
        cat >> .config <<'EOF'
        CONFIG_PACKAGE_luci-app-webadmin=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-app-diskman=y
        CONFIG_PACKAGE_luci-app-autopoweroff=y
        CONFIG_PACKAGE_luci-app-argon-config=y
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_hysteria=y
        CONFIG_PACKAGE_smartdns=y
        CONFIG_PACKAGE_luci-app-smartdns=y
        CONFIG_PACKAGE_luci-app-serverchan=y
        CONFIG_PACKAGE_luci-app-udpxy=y
        CONFIG_PACKAGE_luci-app-uhttpd=y
        CONFIG_PACKAGE_luci-lib-docker=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_luci-app-pptp-server=y
        CONFIG_PACKAGE_luci-app-openvpn-server=y
        CONFIG_PACKAGE_luci-app-oaf=y
        CONFIG_PACKAGE_luci-app-syncdial=y
        CONFIG_PACKAGE_luci-app-wrtbwmon=y
        CONFIG_PACKAGE_luci-app-pushbot=y
        CONFIG_PACKAGE_luci-app-tencentddns=y
        CONFIG_PACKAGE_netdata=y
        CONFIG_PACKAGE_luci-app-netdata=y
        EOF

        # ======== LuCI 主题 ========
        cat >> .config <<'EOF'
        CONFIG_PACKAGE_luci-theme-material=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-theme-edge=y
        EOF

        # ======== 常用软件 ========
        cat >> .config <<'EOF'
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_iperf3=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_screen=y
        CONFIG_PACKAGE_speedtest-go=y
        CONFIG_PACKAGE_tree=y
        CONFIG_PACKAGE_vim-fuller=y
        CONFIG_PACKAGE_xz=y
        EOF

        # ======== 取消镜像填充 ========
        cat >> .config <<'EOF'
        # CONFIG_TARGET_IMAGES_PAD is not set
        EOF

        sed -i 's/^[ \t]*//g' ./.config
        make defconfig

    - name: 修改自定义配置
      run: |
        cd openwrt

        # 修改主机名
        if grep -q "uci commit system" \
          package/lean/default-settings/files/zzz-default-settings; then
          sed -i "/uci commit system/i\\
        uci set system.@system[0].hostname='LEDE-5.15'" \
            package/lean/default-settings/files/zzz-default-settings
        fi

        # 版本号添加编译日期（修复变量展开问题）
        BUILD_DATE=$(TZ='Asia/Shanghai' date '+%Y%m%d')
        sed -i "s/LEDE /Lan build ${BUILD_DATE} @ LEDE /g" \
          package/lean/default-settings/files/zzz-default-settings

        # 修改时间显示（添加文件存在检查）
        INDEX_FILE="package/lean/autocore/files/x86/index.htm"
        if [ -f "$INDEX_FILE" ]; then
          sed -i \
            's/os.date()/os.date("%Y年%m月%d日") .. " " .. translate(os.date("%A")) .. " " .. os.date("%X")/g' \
            "$INDEX_FILE"
          echo "时间格式修改成功"
        else
          echo "::warning::$INDEX_FILE 不存在，跳过时间修改"
        fi

    - name: 下载编译所需安装包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        # 删除下载不完整的文件
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 缓存工具链
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: >-
          ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-
          ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: 开始编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "使用 $(nproc) 线程编译"
        # 多线程 -> 单线程 -> 单线程详细日志（逐级降级）
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && \
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
        echo "FILE_TIME=$(date '+%Y年%m月%d日-%H点')" >> $GITHUB_ENV

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: >-
        steps.compile.outputs.status == 'success' &&
        env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/packages/

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到 GitHub
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_5.15${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 创建 Release 标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
        touch release.txt
        cat >> release.txt <<'EOF'
        ### 📦 固件信息
        - 源码：[coolsnowwolf/lede](https://github.com/coolsnowwolf/lede)
        - 平台：x86_64
        - 感谢所有为 OpenWrt 无私奉献的大佬们！
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布到 Release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      with:
        name: >-
          ${{ env.FILE_TIME }}
          「 OpenWrt-LEDE5.15-X86 」
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 删除旧的 Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 20
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
