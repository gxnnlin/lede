#=================================================
# Description: Build OpenWrt using GitHub Actions
# Author: P3TERX (Modified & Fixed)
#=================================================

name: LEDE-5.15-X86

on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 5,15,25 * *

env:
  # 源码信息
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  SOURCE_REPO: coolsnowwolf/lede
  DEVICE_TARGET: x86
  DEVICE_SUBTARGET: 64
  OPENWRT_PATH: /workdir/openwrt
  
  # 上传配置
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  CACHE_TOOLCHAIN: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查磁盘空间
      run: df -h

    - name: 检查服务器性能
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep 'physical id' | sort | uniq | wc -l)"
        echo "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c)"
        echo "--------------------------内存信息--------------------------"
        echo "$(sudo lshw -short -C memory | grep GiB)"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)"
        df -hT

    - name: 释放磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: 优化磁盘空间
      uses: hugoalh/disk-space-optimizer-ghaction@v0.8.0
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: 最大化构建空间
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: 释放磁盘空间完成
      run: |
        echo "============================================"
        df -hT
        echo "============================================"

    - name: 检出代码
      uses: actions/checkout@main

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* \
          /usr/share/dotnet /usr/local/lib/android \
          /opt/ghc /etc/mysql /etc/php
        sudo -E apt-get -y purge \
          azure-cli* docker* ghc* zulu* hhvm* llvm* \
          firefox* google* dotnet* aspnetcore* \
          powershell* openjdk* adoptopenjdk* \
          mysql* php* mongodb* moby* snap* || true
        sudo -E apt-get update -y
        sudo -E apt-get full-upgrade -y
        sudo -E apt-get install -y \
          ack antlr3 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 ccache cmake \
          cpio curl device-tree-compiler fastjar flex gawk \
          gettext gcc-multilib g++-multilib git gperf haveged \
          help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses5-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool \
          lrzsz mkisofs msmtp ninja-build p7zip p7zip-full \
          patch pkgconf python2.7 python3 python3-pyelftools \
          python3-setuptools qemu-utils rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get autoremove --purge
        sudo -E apt-get clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 下载固件源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义插件
      run: |
        cd openwrt/package
        mkdir -p openwrt-packages
        cd openwrt-packages
        git clone https://github.com/gxnnlin/openwrt-packages.git
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall.git

    - name: 更新 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: 固件定制配置
      run: |
        cd openwrt
        rm -f ./.config*
        touch ./.config

        # ======== 目标平台 ========
        cat >> .config <<EOF
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_TARGET_ROOTFS_TARGZ=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        EOF

        # ======== 固件标题 ========
        cat >> .config <<EOF
        CONFIG_GRUB_TITLE="OpenWrt by Lean"
        EOF

        # ======== 固件压缩 ========
        cat >> .config <<EOF
        CONFIG_TARGET_IMAGES_GZIP=y
        EOF

        # ======== 固件分区大小 ========
        cat >> .config <<EOF
        CONFIG_TARGET_KERNEL_PARTSIZE=128
        CONFIG_TARGET_ROOTFS_PARTSIZE=512
        EOF

        # ======== 固件类型 ========
        cat >> .config <<EOF
        CONFIG_EFI_IMAGES=y
        CONFIG_GRUB_IMAGES=y
        CONFIG_VMDK_IMAGES=y
        EOF

        # ======== IPv6 支持 ========
        cat >> .config <<EOF
        CONFIG_IPV6=y
        CONFIG_KERNEL_IPV6=y
        CONFIG_PACKAGE_ipv6helper=y
        CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
        EOF

        # ======== 多文件系统支持 ========
        cat >> .config <<EOF
        CONFIG_PACKAGE_kmod-fs-cifs=y
        CONFIG_PACKAGE_kmod-fs-f2fs=y
        CONFIG_PACKAGE_kmod-fs-nfs=y
        CONFIG_PACKAGE_kmod-fs-nfs-common=y
        CONFIG_PACKAGE_kmod-fs-nfs-common-rpcsec=y
        CONFIG_PACKAGE_kmod-fs-nfs-v3=y
        CONFIG_PACKAGE_kmod-fs-nfs-v4=y
        CONFIG_PACKAGE_kmod-fs-nfsd=y
        CONFIG_PACKAGE_kmod-fs-squashfs=y
        EOF

        # ======== USB 支持 ========
        cat >> .config <<EOF
        CONFIG_PACKAGE_kmod-usb-ehci=y
        CONFIG_PACKAGE_kmod-usb-net-aqc111=y
        CONFIG_PACKAGE_kmod-usb-net-pl=y
        CONFIG_PACKAGE_kmod-usb-ohci=y
        CONFIG_PACKAGE_kmod-usb-ohci-pci=y
        CONFIG_PACKAGE_kmod-usb-printer=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-uhci=y
        CONFIG_PACKAGE_kmod-usb-wdm=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb2-pci=y
        CONFIG_PACKAGE_kmod-usb3=y
        EOF

        # ======== LuCI 插件 ========
        cat >> .config <<EOF
        CONFIG_PACKAGE_luci-app-webadmin=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-app-diskman=y
        CONFIG_PACKAGE_luci-app-autopoweroff=y
        CONFIG_PACKAGE_luci-app-argon-config=y
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_hysteria=y
        CONFIG_PACKAGE_luci-app-ssr-plus=y
        CONFIG_PACKAGE_ddnsto=y
        CONFIG_PACKAGE_luci-app-ddnsto=y
        CONFIG_PACKAGE_smartdns=y
        CONFIG_PACKAGE_luci-app-smartdns=y
        CONFIG_PACKAGE_oscam=y
        CONFIG_PACKAGE_luci-app-oscam=y
        CONFIG_PACKAGE_tvheadend=y
        CONFIG_PACKAGE_luci-app-serverchan=y
        CONFIG_PACKAGE_luci-app-udpxy=y
        CONFIG_PACKAGE_luci-app-uhttpd=y
        CONFIG_PACKAGE_luci-app-familycloud=y
        CONFIG_PACKAGE_luci-lib-docker=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_luci-app-pptp-server=y
        CONFIG_PACKAGE_luci-app-openvpn-server=y
        CONFIG_PACKAGE_luci-app-oaf=y
        CONFIG_PACKAGE_luci-app-syncdial=y
        CONFIG_PACKAGE_luci-app-wrtbwmon=y
        CONFIG_PACKAGE_luci-app-pushbot=y
        CONFIG_PACKAGE_luci-app-tencentddns=y
        CONFIG_PACKAGE_luci-app-store=y
        CONFIG_PACKAGE_netdata=y
        CONFIG_PACKAGE_luci-app-netdata=y
        EOF

        # ======== LuCI 主题 ========
        cat >> .config <<EOF
        CONFIG_PACKAGE_luci-theme-material=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-theme-edge=y
        EOF

        # ======== 常用软件 ========
        cat >> .config <<EOF
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_iperf3=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_screen=y
        CONFIG_PACKAGE_speedtest-go=y
        CONFIG_PACKAGE_tree=y
        CONFIG_PACKAGE_vim-fuller=y
        CONFIG_PACKAGE_xz=y
        EOF

        # ======== 取消镜像填充 ========
        cat >> .config <<EOF
        # CONFIG_TARGET_IMAGES_PAD is not set
        EOF

        sed -i 's/^[ \t]*//g' ./.config
        make defconfig

    - name: 修改自定义配置
      run: |
        cd openwrt

        # 修改主机名
        sed -i '/uci commit system/i\uci set system.@system[0].hostname='"'"'LEDE-5.15'"'"'' \
          package/lean/default-settings/files/zzz-default-settings

        # 版本号添加编译日期
        sed -i "s/LEDE /Lan build $(TZ=UTC-8 date '+%Y%m%d') @ LEDE /g" \
          package/lean/default-settings/files/zzz-default-settings

        # 修改时间显示为中文
        sed -i 's/os.date()/os.date("%Y年%m月%d日") .. " " .. translate(os.date("%A")) .. " " .. os.date("%X")/g' \
          package/lean/autocore/files/x86/index.htm

    - name: 下载编译所需安装包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 缓存工具链
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: 开始编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | \
          sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && \
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
        echo "FILE_TIME=$(date '+%Y年%m月%d日-%H点')" >> $GITHUB_ENV

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/packages/

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到 GitHub
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_5.15${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 创建 Release 标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
        touch release.txt
        echo "[固件源码](https://github.com/coolsnowwolf/lede)" >> release.txt
        echo "感谢所有为 OpenWrt 无私奉献的大佬们" >> release.txt
        echo "📥 固件下载" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布到 Release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      with:
        name: ${{ env.FILE_TIME }} 「 OpenWrt-LEDE5.15-X86 」
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 删除旧的 Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 20
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
